<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Healthcare software solutions by Fiaz Hussain</title>
  <desc id="desc">Hospital management and telemedicine AI platform solution concepts with advanced healthcare interoperability, security and cloud technology.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061827"/><stop offset=".52" stop-color="#0b2336"/><stop offset="1" stop-color="#062f3b"/></linearGradient>
    <linearGradient id="cyan" x2="1" y2="1"><stop stop-color="#0891b2"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dy="10" stdDeviation="12" flood-color="#000814" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1400" height="650" rx="32" fill="url(#bg)"/>
  <circle cx="1310" cy="35" r="190" fill="#22d3ee" opacity=".07"/><circle cx="30" cy="640" r="180" fill="#22c55e" opacity=".06"/>
  <g font-family="Arial,sans-serif">
    <rect x="55" y="40" width="50" height="50" rx="15" fill="url(#cyan)"/><path d="M80 51v28M66 65h28" stroke="white" stroke-width="7" stroke-linecap="round"/>
    <text x="125" y="66" fill="#f8fafc" font-size="31" font-weight="800">Healthcare Solutions I Can Architect &amp; Build</text>
    <text x="125" y="94" fill="#94a3b8" font-size="16">Secure, interoperable and scalable platforms designed for hospitals, clinics and digital-health teams.</text>

    <g transform="translate(55 132)" filter="url(#shadow)">
      <rect width="625" height="360" rx="24" fill="#0e2033" stroke="#0ea5a4" stroke-width="2"/>
      <rect x="26" y="24" width="62" height="62" rx="18" fill="url(#cyan)"/>
      <path d="M41 70V47h32v23M48 47v-9h18v9M48 57h5M61 57h5M48 67h5M61 67h5" fill="none" stroke="white" stroke-width="3" stroke-linejoin="round"/>
      <text x="108" y="49" fill="#5eead4" font-size="13" font-weight="700">HEALTHCARE PLATFORM CONCEPT 01</text>
      <text x="108" y="78" fill="white" font-size="24" font-weight="800">Smart Hospital Management</text>
      <text x="26" y="124" fill="#cbd5e1" font-size="16">One connected system for clinical and operational workflows.</text>
      <g fill="#9fb3c8" font-size="15"><text x="35" y="163">● Patient registration, appointments &amp; queue management</text><text x="35" y="194">● EHR/EMR, prescriptions, labs, pharmacy &amp; billing</text><text x="35" y="225">● Doctor, nurse, admin and patient role-based portals</text><text x="35" y="256">● Bed, inventory, staff, claims and analytics workflows</text></g>
      <g fill="#073b3b" stroke="#0f766e"><rect x="26" y="290" width="92" height="34" rx="17"/><rect x="126" y="290" width="94" height="34" rx="17"/><rect x="228" y="290" width="105" height="34" rx="17"/><rect x="341" y="290" width="83" height="34" rx="17"/><rect x="432" y="290" width="164" height="34" rx="17"/></g>
      <g fill="#99f6e4" font-size="12" font-weight="700" text-anchor="middle"><text x="72" y="312">Next.js</text><text x="173" y="312">FastAPI</text><text x="280" y="312">PostgreSQL</text><text x="382" y="312">Redis</text><text x="514" y="312">Docker / AWS</text></g>
    </g>

    <g transform="translate(720 132)" filter="url(#shadow)">
      <rect width="625" height="360" rx="24" fill="#0e2033" stroke="#6366f1" stroke-width="2"/>
      <rect x="26" y="24" width="62" height="62" rx="18" fill="url(#blue)"/>
      <path d="M43 48h29v21H56l-9 8v-8h-4z" fill="none" stroke="white" stroke-width="3" stroke-linejoin="round"/><path d="M51 59h13" stroke="white" stroke-width="3" stroke-linecap="round"/>
      <text x="108" y="49" fill="#a5b4fc" font-size="13" font-weight="700">DIGITAL HEALTH CONCEPT 02</text>
      <text x="108" y="78" fill="white" font-size="24" font-weight="800">Telemedicine &amp; AI Care Platform</text>
      <text x="26" y="124" fill="#cbd5e1" font-size="16">Remote-care workflows with responsible AI decision support.</text>
      <g fill="#9fb3c8" font-size="15"><text x="35" y="163">● Secure video consultation, scheduling and messaging</text><text x="35" y="194">● Symptom intake, document analysis and care summaries</text><text x="35" y="225">● Remote monitoring, reminders and patient engagement</text><text x="35" y="256">● AI-assisted insights with clinician review and audit trail</text></g>
      <g fill="#1e1b4b" stroke="#6366f1"><rect x="26" y="290" width="92" height="34" rx="17"/><rect x="126" y="290" width="92" height="34" rx="17"/><rect x="226" y="290" width="80" height="34" rx="17"/><rect x="314" y="290" width="112" height="34" rx="17"/><rect x="434" y="290" width="162" height="34" rx="17"/></g>
      <g fill="#c7d2fe" font-size="12" font-weight="700" text-anchor="middle"><text x="72" y="312">React</text><text x="172" y="312">Django</text><text x="266" y="312">WebRTC</text><text x="370" y="312">AI / RAG</text><text x="515" y="312">FHIR / HL7</text></g>
    </g>

    <text x="55" y="545" fill="#67e8f9" font-size="14" font-weight="700">INTEROPERABILITY</text><text x="55" y="574" fill="#e2e8f0" font-size="17">FHIR · HL7 · DICOM/PACS · Laboratory &amp; pharmacy integrations</text>
    <text x="520" y="545" fill="#86efac" font-size="14" font-weight="700">SECURITY &amp; GOVERNANCE</text><text x="520" y="574" fill="#e2e8f0" font-size="17">RBAC · MFA · Encryption · Consent · Audit logs · Backup &amp; recovery</text>
    <text x="1015" y="545" fill="#c4b5fd" font-size="14" font-weight="700">DELIVERY</text><text x="1015" y="574" fill="#e2e8f0" font-size="17">Cloud · CI/CD · Monitoring · APIs</text>
    <rect x="55" y="608" width="1290" height="1" fill="#1e5362"/><text x="700" y="632" text-anchor="middle" fill="#64748b" font-size="13">Solution concepts — final architecture, compliance controls and integrations are tailored to each healthcare organization.</text>
  </g>
</svg>
