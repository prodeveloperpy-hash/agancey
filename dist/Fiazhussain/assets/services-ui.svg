<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Services offered by Fiaz Hussain</title>
  <desc id="desc">Full-stack development, solution architecture and cloud, AI and automation, data engineering and analytics, mobile application development, and ecommerce and CMS services.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1400" height="760" rx="30" fill="url(#background)"/>
  <circle cx="1300" cy="20" r="180" fill="#06b6d4" opacity="0.06"/>
  <circle cx="80" cy="750" r="180" fill="#2563eb" opacity="0.08"/>

  <text x="60" y="68" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="800">Services &amp; Capabilities</text>
  <text x="60" y="103" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17">From product strategy and architecture to development, automation, data, and deployment.</text>
  <rect x="60" y="126" width="1280" height="2" fill="#1e293b"/>

  <!-- Card 1 -->
  <g transform="translate(60 164)" filter="url(#shadow)">
    <rect width="400" height="245" rx="22" fill="#0f172a" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="24" y="24" width="58" height="58" rx="16" fill="url(#blue)"/>
    <path d="M58 41L45 53l13 12M68 41l13 12-13 12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="49" fill="#60a5fa" font-family="Arial, sans-serif" font-size="13" font-weight="700">01 • BUILD</text>
    <text x="100" y="76" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="800">Full-Stack Development</text>
    <text x="24" y="119" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Responsive web products, SaaS platforms,</text>
    <text x="24" y="145" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">REST APIs, microservices, and integrations.</text>
    <g fill="#172554" stroke="#2563eb"><rect x="24" y="176" width="75" height="34" rx="17"/><rect x="107" y="176" width="91" height="34" rx="17"/><rect x="206" y="176" width="87" height="34" rx="17"/><rect x="301" y="176" width="75" height="34" rx="17"/></g>
    <g fill="#bfdbfe" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><text x="61" y="198">React</text><text x="152" y="198">TypeScript</text><text x="249" y="198">Python</text><text x="338" y="198">Node.js</text></g>
  </g>

  <!-- Card 2 -->
  <g transform="translate(500 164)" filter="url(#shadow)">
    <rect width="400" height="245" rx="22" fill="#0f172a" stroke="#0e7490" stroke-width="2"/>
    <rect x="24" y="24" width="58" height="58" rx="16" fill="url(#blue)"/>
    <path d="M39 57h29M45 48h29M51 39h29M39 66h29" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
    <text x="100" y="49" fill="#22d3ee" font-family="Arial, sans-serif" font-size="13" font-weight="700">02 • ARCHITECT</text>
    <text x="100" y="76" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="800">Architecture &amp; Cloud</text>
    <text x="24" y="119" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Secure system design, database architecture,</text>
    <text x="24" y="145" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">authentication, CI/CD, and scalable hosting.</text>
    <g fill="#083344" stroke="#0891b2"><rect x="24" y="176" width="68" height="34" rx="17"/><rect x="100" y="176" width="65" height="34" rx="17"/><rect x="173" y="176" width="74" height="34" rx="17"/><rect x="255" y="176" width="121" height="34" rx="17"/></g>
    <g fill="#a5f3fc" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><text x="58" y="198">AWS</text><text x="132" y="198">GCP</text><text x="210" y="198">Docker</text><text x="315" y="198">DigitalOcean</text></g>
  </g>

  <!-- Card 3 -->
  <g transform="translate(940 164)" filter="url(#shadow)">
    <rect width="400" height="245" rx="22" fill="#0f172a" stroke="#7c3aed" stroke-width="2"/>
    <rect x="24" y="24" width="58" height="58" rx="16" fill="url(#purple)"/>
    <circle cx="53" cy="53" r="13" fill="none" stroke="#fff" stroke-width="3"/><path d="M53 33v7M53 66v7M33 53h7M66 53h7" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
