    <text x="100" y="76" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="800">AI &amp; Automation</text>
    <text x="24" y="119" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">AI agents, RAG, chatbots, lead workflows,</text>
    <text x="24" y="145" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">CRM automation, and cross-system sync.</text>
    <g fill="#2e1065" stroke="#7c3aed"><rect x="24" y="176" width="79" height="34" rx="17"/><rect x="111" y="176" width="65" height="34" rx="17"/><rect x="184" y="176" width="58" height="34" rx="17"/><rect x="250" y="176" width="126" height="34" rx="17"/></g>
    <g fill="#ddd6fe" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><text x="63" y="198">OpenAI</text><text x="143" y="198">Claude</text><text x="213" y="198">n8n</text><text x="313" y="198">GHL / Zapier</text></g>
  </g>

  <!-- Card 4 -->
  <g transform="translate(60 449)" filter="url(#shadow)">
    <rect width="400" height="245" rx="22" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <rect x="24" y="24" width="58" height="58" rx="16" fill="url(#blue)"/>
    <path d="M40 68V55M53 68V43M66 68V50" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="100" y="49" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="700">04 • UNDERSTAND</text>
    <text x="100" y="76" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="800">Data Engineering &amp; AI</text>
    <text x="24" y="119" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">ETL/ELT, analytics, warehousing, search,</text>
    <text x="24" y="145" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">dashboards, ranking, and data science.</text>
    <g fill="#0c4a6e" stroke="#0284c7"><rect x="24" y="176" width="82" height="34" rx="17"/><rect x="114" y="176" width="91" height="34" rx="17"/><rect x="213" y="176" width="107" height="34" rx="17"/><rect x="328" y="176" width="48" height="34" rx="17"/></g>
    <g fill="#bae6fd" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><text x="65" y="198">BigQuery</text><text x="159" y="198">Elastic</text><text x="266" y="198">Power BI</text><text x="352" y="198">SQL</text></g>
  </g>

  <!-- Card 5 -->
  <g transform="translate(500 449)" filter="url(#shadow)">
    <rect width="400" height="245" rx="22" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <rect x="24" y="24" width="58" height="58" rx="16" fill="url(#blue)"/>
    <rect x="42" y="34" width="23" height="39" rx="4" fill="none" stroke="#fff" stroke-width="3"/><circle cx="53.5" cy="66" r="2" fill="#fff"/>
    <text x="100" y="49" fill="#67e8f9" font-family="Arial, sans-serif" font-size="13" font-weight="700">05 • MOBILIZE</text>
    <text x="100" y="76" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="800">Mobile Applications</text>
    <text x="24" y="119" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Cross-platform apps, APIs, authentication,</text>
    <text x="24" y="145" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">notifications, payments, maps, and releases.</text>
    <g fill="#083344" stroke="#06b6d4"><rect x="24" y="176" width="72" height="34" rx="17"/><rect x="104" y="176" width="105" height="34" rx="17"/><rect x="217" y="176" width="69" height="34" rx="17"/><rect x="294" y="176" width="82" height="34" rx="17"/></g>
    <g fill="#cffafe" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><text x="60" y="198">Flutter</text><text x="156" y="198">React Native</text><text x="251" y="198">Kotlin</text><text x="335" y="198">Firebase</text></g>
  </g>

  <!-- Card 6 -->
  <g transform="translate(940 449)" filter="url(#shadow)">
    <rect width="400" height="245" rx="22" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
    <rect x="24" y="24" width="58" height="58" rx="16" fill="url(#blue)"/>
    <path d="M38 45h31l-3 24H42zM46 45l3-8h10l3 8" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <text x="100" y="49" fill="#60a5fa" font-family="Arial, sans-serif" font-size="13" font-weight="700">06 • SELL</text>
    <text x="100" y="76" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="800">E-Commerce &amp; CMS</text>
    <text x="24" y="119" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Stores, catalogues, payments, custom themes,</text>
    <text x="24" y="145" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">performance, SEO, and ongoing maintenance.</text>
    <g fill="#172554" stroke="#2563eb"><rect x="24" y="176" width="86" height="34" rx="17"/><rect x="118" y="176" width="98" height="34" rx="17"/><rect x="224" y="176" width="112" height="34" rx="17"/><rect x="344" y="176" width="32" height="34" rx="16"/></g>
    <g fill="#bfdbfe" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><text x="67" y="198">Shopify</text><text x="167" y="198">WordPress</text><text x="280" y="198">WooCommerce</text><text x="360" y="198">+</text></g>
  </g>
