<rect width="1400" height="590" rx="32" fill="url(#bg)"/><circle cx="1320" cy="15" r="190" fill="#22d3ee" opacity=".08"/><circle cx="40" cy="570" r="160" fill="#8b5cf6" opacity=".08"/>
<text x="55" y="62" fill="#f8fafc" font-family="Arial,sans-serif" font-size="30" font-weight="800">Solutions built around real business outcomes</text>
<text x="55" y="96" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">Strategy, engineering, integration and reliable delivery — from one feature to a complete platform.</text>

