<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="590" viewBox="0 0 1400 590" role="img" aria-labelledby="t d">
<title id="t">Digital services by Fiaz Hussain</title><desc id="d">Nine visual cards for SaaS, ecommerce, AI, automation, CRM, APIs, data, mobile and cloud services.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset=".52" stop-color="#111936"/><stop offset="1" stop-color="#082f49"/></linearGradient>
  <linearGradient id="a" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
